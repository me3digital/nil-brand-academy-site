# Netlify config for the STAGING site of the NIL Intelligence Network only.
# It lives in this subfolder so it can never affect the production site, which publishes the repo root.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NIL_STAGING = "1"
  # Hosted builds must read the live database. Without DATABASE_URL the build fails instead of using repo files.
  NIL_REQUIRE_DB = "1"

# Staging is blocked from search engines three ways: this header, the robots meta on every page, and robots.txt.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
